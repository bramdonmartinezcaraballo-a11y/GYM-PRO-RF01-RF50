<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso · GYM PRO</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#0b1220;color:#e8eef8;min-height:100vh;display:grid;place-items:center}.card{background:#111c2e;border:1px solid #24344d;color:#e8eef8;width:min(420px,94vw)}.form-control{background:#0c1627;color:#fff;border-color:#34445d}</style></head><body><div class="card p-4"><div class="text-center mb-3"><div class="text-uppercase fw-bold fs-2" style="color:#c4b5fd;letter-spacing:.1em">GYM PRO</div><div class="text-secondary">Sistema de gestión del gimnasio</div></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label class="form-label">Usuario</label><input class="form-control mb-3" name="usuario" required autofocus><label class="form-label">Contraseña</label><input class="form-control mb-4" type="password" name="contrasena" required><button class="btn btn-primary w-100">Ingresar</button></form></div></body></html>
